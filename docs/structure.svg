<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>

  <text x="30" y="34" font-size="15" font-weight="bold">One period of nk.run(landscape, agents, periods, rng, rules)</text>

  <!-- rng notes -->
  <text x="320" y="64" text-anchor="middle" font-size="11" fill="#57606a">own rng stream per agent</text>
  <text x="548" y="64" text-anchor="middle" font-size="11" fill="#57606a">own rng stream per rule</text>

  <!-- Population snapshot -->
  <rect x="30" y="76" width="160" height="86" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="110" y="100" text-anchor="middle" font-weight="bold">Population</text>
  <text x="110" y="122" text-anchor="middle">configs, fitness, alive</text>
  <text x="110" y="140" text-anchor="middle">of the last period</text>

  <!-- Agent.step -->
  <rect x="240" y="76" width="160" height="86" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
  <text x="320" y="100" text-anchor="middle" font-weight="bold">Agent.step</text>
  <text x="320" y="122" text-anchor="middle">one call per agent,</text>
  <text x="320" y="140" text-anchor="middle">returns a proposal</text>

  <!-- PopulationRule.decide -->
  <rect x="458" y="76" width="180" height="86" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4"/>
  <text x="548" y="100" text-anchor="middle" font-weight="bold">PopulationRule.decide</text>
  <text x="548" y="122" text-anchor="middle">adopted configs,</text>
  <text x="548" y="140" text-anchor="middle">who dies, who is born</text>

  <!-- RunResult -->
  <rect x="686" y="76" width="104" height="86" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
  <text x="738" y="100" text-anchor="middle" font-weight="bold">RunResult</text>
  <text x="738" y="122" text-anchor="middle">configs[a, t]</text>
  <text x="738" y="140" text-anchor="middle">fitness[a, t]</text>

  <!-- arrows along the row -->
  <line x1="190" y1="119" x2="238" y2="119" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="400" y1="119" x2="456" y2="119" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="428" y="110" text-anchor="middle" font-size="11" fill="#57606a">proposals</text>
  <line x1="638" y1="119" x2="684" y2="119" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- next period: back to Population -->
  <path d="M 738 162 L 738 196 L 110 196 L 110 164" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="424" y="190" text-anchor="middle" font-size="11" fill="#57606a">next period</text>

  <!-- Landscape -->
  <rect x="240" y="266" width="398" height="86" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
  <text x="439" y="290" text-anchor="middle" font-weight="bold">Landscape</text>
  <text x="439" y="312" text-anchor="middle">N decisions, interaction matrix, contribution tables</text>
  <text x="439" y="330" text-anchor="middle">fitness(config), neighbours(config), peaks()</text>

  <!-- read-only access to the landscape -->
  <line x1="320" y1="264" x2="320" y2="164" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="548" y1="264" x2="548" y2="164" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="434" y="236" text-anchor="middle" font-size="11" fill="#57606a">read, never changed during a run</text>
</svg>
