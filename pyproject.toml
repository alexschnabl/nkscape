[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nkscape"
version = "0.1.0"
description = "Kauffman NK fitness landscapes and NK-based agent-based models of organisations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alexander Schnabl" }]
keywords = ["NK model", "fitness landscape", "agent-based model", "organisation science", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.1"]

[project.urls]
Repository = "https://github.com/alexschnabl/nkscape"
Issues = "https://github.com/alexschnabl/nkscape/issues"
Changelog = "https://github.com/alexschnabl/nkscape/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbmake>=1.5.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nkscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# D213: docstring text starts on the line after the opening quotes
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PT", "RUF", "D213"]

[tool.ruff.lint.per-file-ignores]
# notebooks hold the article's readings as one line per K
"*.ipynb" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
